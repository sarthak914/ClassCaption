# docker compose up --build -d   →   http://localhost:3000 (phones: http://<laptop-wifi-ip>:3000)
# Keys come from .env.local at run time. Inside Docker the app can't see the laptop's Wi-Fi address,
# so add PUBLIC_BASE_URL=http://<laptop-wifi-ip>:3000 to .env.local for the join QR code.
services:
  classcaption:
    build: .
    image: classcaption:latest
    ports:
      - "3000:3000"
    env_file: .env.local
    restart: unless-stopped

  # Optional open-source translator (AI4Bharat IndicTrans2), CPU:  docker compose --profile indictrans2 up --build -d
  # then set INDICTRANS2_URL=http://indictrans2:7860 in .env.local and put indictrans2 in TRANSLATION_PROVIDERS.
  indictrans2:
    profiles: ["indictrans2"]
    build: ./indictrans2
    ports:
      - "7860:7860"
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
